<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      font-family: Arial;
    }

    .container{
      width: 450px;
    }

    .profile{
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-pic{
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-right: 15px;
      object-fit: cover;
    }

    .info{
      flex: 1;
    }

    .name{
    font-weight: bold;
    font-size: 20px;
    margin: 0;
}

.animal{
    color: gray;
    font-size: 18px;
    margin: 4px 0;
}

.status{
    color: gray;
    font-size: 16px;
    margin: 0;
}

button{
    background-color: #4195f5;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition-duration: .2s;
}

button:hover{
    background-color: #2f84e8;
}
  </style>
</head>
<body>
<div class="container">

  <div class="profile">
    <img class="profile-pic" src="./youtube/channel-pictures/channel-1.jpeg" alt="">

    <div class="info">
      <p class="name">oliver</p>
      <p class="animal">the cat</p>
      <p class="status">Popular</p>
    </div>
    <button>Follow</button>
  </div>
  <div class="profile">
    <img class="profile-pic" src="./youtube/channel-pictures/channel-2.jpeg" alt="">

    <div class="info">
      <p class="name">Max</p>
      <p class="animal">the dog</p>
      <p class="status">Popular</p>
    </div>
    <button>Follow</button>
  </div>
  <div class="profile">
    <img class="profile-pic" src="./youtube/channel-pictures/channel-6.jpeg" alt="">

    <div class="info">
      <p class="name">Mr. Whiskers</p>
      <p class="animal">the cat</p>
      <p class="status">Not Popular</p>
    </div>
    <button>Follow</button>
  </div>
</div>
</body>
</html>
