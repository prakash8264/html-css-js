<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .myButton{
      background-color: rgb(200, 0, 0);
      color: white;
      border: none;
      height: 35px;
      width: 105px;
      border-radius: 2%;
      cursor: pointer;
      margin-right: 8px;
      margin-left: 8px;
      transition: opacity 0.15s;
    }
    .myButton:hover{
      opacity: 0.8;
    }
    .myButton:active{
      opacity: 0.4;
    }
    .join{
      background-color: white;
      border-color: rgb(41, 118, 211);
      border-style: solid;
      border-width: 1px;
      color: rgb(122, 199, 199);
      height: 35px;
      width: 62px;
      text-align: center;
      border-radius: 3px;
      cursor: pointer;
      margin-right: 8px;
      transition: background-color 0.15s, color 0.15s;
    }
    .join:hover{
      background-color: rgb(41, 118, 211);
      color: white
    }
    .join:active{
      opacity: 0.7;
    }
    .Tweet{
      width: 74px;
      height: 36px;
      border-radius: 20px;
      border: none;
      background-color: rgb(9, 171, 247);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
      transition: box-shadow 0.15s;
    }
    .Tweet:hover{
      
      box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
    }
</style>
<body>
    <P>HELLO </P>
    <a href="https://www.youtube.com" target="_blank">YouTube</a>
    <button class="myButton">SUBSCRIBE</button>
    <button class="join">JOIN</button>
    <button class="Tweet">Tweet</button>

</body>
</html>
