<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Box</title>

  <style>
    body{
      min-height: 800px;
      border: 8px solid black;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;

      justify-content: center;
      align-items: center;
      align-content: center;
      
    }
    .box{
      height: 200px;
      width: 200px;
      font-size: 40px;
      background-color: blue;
      border-color: black;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

  </style>
</head>
<body>

  <div class="box">1</div>
  <div class="box">2</div>
  <div class="box">3</div>
  <div class="box">4</div>
  <div class="box">5</div>
  <div class="box">6</div>
  <div class="box">7</div>
  <div class="box">8</div>
  <div class="box">9</div>
  </div>
  
</body>
</html>
